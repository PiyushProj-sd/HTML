<!DOCTYPE html>
<html>
    <head>
        <title class="title">Lesson 8 Exercise</title>
        <style>
            .name-input,
            .email-input{
                border-radius: 3px;
                border-width: 1px;
                height: 20px;
                width: 200px;
                padding-left: 10px;
                display: block;
                margin-bottom: 7px;
            }

            p,
            button{
                font-family: Arial, Helvetica, sans-serif;
            }

            .text{
                display: inline-block;
                width: 220px;
                vertical-align: middle;
            }

            .buttons{
                margin-right: 5px;
                vertical-align: middle;
            }

            .google{
                width: 150px;
                height: 50px;
                object-fit: cover;
                margin-left: 75px;
                display: block;
                margin-bottom: 10px;
            }

            .search{
                width: 310px;
                height: 30px;
                border-radius: 30px;
                border-width: 1px;
                border-style: solid;
                border-color: rgb(204, 193, 193);
                padding-left: 10px;
                box-shadow: 0 0 5px rgb(157, 152, 152);
                display: block;
                margin-bottom: 30px;

            }

            .sign-up1,
            .sign-up2,
            .sign-up3,
            .sign-up4{
                height: 40px;
                width: 300px;
                padding-left: 10px;
                font-family: Arial, Helvetica, sans-serif;
                border-radius: 10px;
                border-color: lightgrey;
                border-style: solid;
                font-size: large;
            }

            .sign-up3{
                display: block;
                margin-top: 5px;
                width: 620px;
            }
            .sign-up4{
                margin-top: 10px;
                width: 635px;
                background-color: rgb(43, 61, 255);
                height: 50px;
                color: white;
                font-weight: bold;
                cursor: pointer;
                border: none;
                font-size: larger

            }
        </style>
    </head>
    <body>
        <input class="name-input" placeholder="Name">
        <input class="email-input" type="email" placeholder="Email">

        <p class="text">
            Thanks for chatting with our customer 
            suport. Would you like to take our
            quick survey?
        </p>

        <button class="buttons">
            Yes
        </button>

        <button class="buttons">
            No
        </button>

        <img class="google" src="photos/google.png">
        <input type="url" placeholder="Search Google or type a URL" 
        class="search">

        <input class="sign-up1" placeholder="First Name">
        <input class="sign-up2" placeholder="Last Name">
        <input class="sign-up3" placeholder="Email">

        <button class="sign-up4">Sign Up</button>

    </body>
</html>
