<!DOCTYPE html>
<html>
    <head>
        <title>Div usage</title>
        <style>
            div{
                margin: 10px;
                display: inline-block;
            }
            .redcolor{
                background-color: red;
                height: 300px;
                width: 300px;
            }

            .greencircle{
                background-color: green;
                height: 300px;
                width: 300px;
                border-radius: 150px;
            }
            
            .div3{
                height: 100px;
                width: 420px;
                border: 1px solid rgb(34, 33, 33);
                display: block;
                padding-left: 20px;
            }

            .div4{
                border:none;
                background-color: rgb(39, 39, 39);
                height: 140px;
                width: 420px;
                padding-left: 20px;
                display: block;
            }
            
            .div3para{
                
                font-size: 20px;
            }

            .div4para1{
                
                font-size: 30px;
                font-weight: bolder;
                color: white;
                padding-top: 20px;
            }

            .div4para2{
                color: grey;
                font-size: 18px;

            }

            p{
                font-family: Arial, Helvetica, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="redcolor">
        </div>

        <div class="greencircle">
        </div>

        <div class="div3">
            <p class="div3para">
                Satisfied with our service?
            </p>
            <button>Yes</button>
            <button>No</button>
        </div>

        <div class="div4">
            <p class="div4para1">
                Install YoutTube Music
            </p>
            <p class="div4para2">
                Add YoutTube Music to your desktop for easy access
            </p>
        </div>
    </body>
</html>
