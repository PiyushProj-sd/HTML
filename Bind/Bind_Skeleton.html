<!DOCTYPE html>
<html>
  <head>
    <title>Bind Web</title>
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/chat-section.css">
    <link rel="stylesheet" href="Styles/Search.css">
    <link rel="stylesheet" href="Styles/AllText.css">
    <link rel="stylesheet" href="Styles/Tags.css">
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <span class="header-span">
          <img src="icons/chat.png" class="header-icon">
        </span>

        <span class="header-span">
          <img src="icons/status.png" class="header-icon">
        </span>
      </div>

      <div class="header-bottom">
        <span class="header-span">
          <img class="header-icon" src="icons/media.png">
        </span>
        
        <img src="pfps/my-profile-photo.enc" class="header-img">
      </div>
    </div>
    <div class="chat-section">
      <div class="top-grid">
        <div class="top-section">
          <div class="top-left">
            <h2>
              Bind
            </h2>
          </div>
          
          <div class="top-right">
            <span class="header-span">
              <img class="header-icon" src="icons/new-chat.png">
            </span>
            <span class="header-span">
              <img class="header-icon" src="icons/menu.png">
            </span>
          </div>
        </div>
        
        <div class="search-section">
          <span class="search-icon-span">
            <img src="icons/search.png" class="search-icon">
          </span>
          <input type="text" class="search-box" placeholder="Search or start a new chat">
        </div>
      </div>

      <div class="tags">
        
      </div>
    </div>
  </body>
</html>
