<!DOCTYPE html>
<html>
  <head>
    <title>
      Grid Practice
    </title>
  </head>
  <body>
    <div style="
      display: grid;
      grid-template-columns: 300px 300px;

      ">
      <div style="background-color: pink;">
        300px
      </div>
      <div style="background-color: rgb(192, 192, 192);">
        300px
      </div>
    </div>

  
    <div style="
      display: grid;
      margin-top: 40px;
      grid-template-columns: 100px 1fr ;
    ">
      <div style="background-color: lightblue;">
        100px
      </div>
      <div style="background-color: lightpink;">
        1fr
      </div>
    </div>

    <div style="
      display: grid;
      margin-top: 40px;
      grid-template-columns: 100px 1fr 2fr;
    ">
      <div style="background-color: lightblue;">
        100px
      </div>
      <div style="background-color: lightpink;">
        1fr
      </div>
      <div style="background-color: red;">
        2fr
      </div>
    </div>


    <div style="
    display: grid;
    margin-top: 40px;
    grid-template-columns: 1fr 1fr 1fr ;
    column-gap: 20px;
    row-gap: 20px;
    margin-right: 20px;
    margin-left: 10px;
    ">
      <div style="background-color: lightblue;
      height: 200px;
      ">
        1fr
      </div>
      <div style="background-color: lightpink;
      height: 200px;
      ">
        1fr
      </div>
      <div style="background-color: rgb(116, 62, 70);
      height: 200px;
      ">
        1fr
      </div>

      <div style="background-color: rgb(116, 62, 70);
      height: 200px;
      ">
        1fr
      </div>
      <div style="background-color: lightblue;
      height: 200px;">
        1fr
      </div>
      <div style="background-color: lightpink;
      height: 200px;">
        1fr
      </div>

    </div>
  </body>
</html>
