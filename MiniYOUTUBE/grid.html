<!DOCTYPE html>
<html>
  <head>
    <title>
      Grid Practice
    </title>
  </head>
  <body>
    <div style="
      display: grid;
      grid-template-columns: 300px 300px;

      ">
      <div style="background-color: pink;">
        div 1
      </div>
      <div style="background-color: rgb(192, 192, 192);">
        div 2<p>text</p>
      </div>
    </div>

    <div style="
      display: grid;
      margin-top: 30px;
      grid-template-columns: 300px 300px 200px;

      ">
      <div style="background-color: pink;">
        div 1
      </div>
      <div style="background-color: rgb(192, 192, 192);">
        div 2<p>text</p>
      </div>
      <div style="background-color: lightgreen;">
        div 3
      </div>
    </div>
  </body>
</html>
